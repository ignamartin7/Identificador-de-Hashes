[project]
name = "hash-identifier"
version = "1.0.0"
description = "Identifica el tipo probable de un hash por prefijo, longitud y charset"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }

# Única dependencia real: rich, para la salida en terminal con colores
# y tablas. Toda la lógica de identificación es Python puro (sin red,
# sin criptografía externa) — por eso el proyecto puede correr offline.
dependencies = [
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

# Después de `pip install -e .` el comando `hashid-mini <valor>`
# queda disponible en el PATH del entorno virtual.
[project.scripts]
hashid-mini = "hash_identifier:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["hash_identifier.py"]

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
